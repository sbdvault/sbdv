# Amvera Cloud — Next.js Docker config
# Docs: https://docs.amvera.ru/applications/configuration/docker.html
# Amvera ingress defaults to port 80 — keep app on 80 for free domains.

meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 80
  servicePort: 80
  persistenceMount: /data
